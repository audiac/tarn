name: Release

# Builds Vellum on macOS, Windows, and Linux and attaches the installers
# to a GitHub Release whenever a version tag (e.g. v1.0.0) is pushed.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos
          - os: windows-latest
            name: windows
          - os: ubuntu-latest
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installers
        run: npm run make

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vellum-${{ matrix.name }}
          path: out/make/**/*

  # Publish once, after all platform builds finish. Attaching from within the
  # build matrix instead made the three jobs race each other creating the same
  # release and uploading assets concurrently, which failed intermittently
  # ("Error creating asset temp dir" / "Error saving asset").
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Publish with the gh CLI rather than softprops/action-gh-release, which
      # intermittently failed with "Error creating asset temp dir" (it mishandles
      # asset filenames containing spaces, e.g. "Vellum-1.1.2 Setup.exe").
      # -print0 | xargs -0 preserves those spaces when uploading.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                 --title "$GITHUB_REF_NAME" --generate-notes
          find artifacts -type f -print0 \
            | xargs -0 gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber
