name: Release

# Builds Vellum on macOS, Windows, and Linux and attaches the installers
# to a GitHub Release whenever a version tag (e.g. v1.0.0) is pushed.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos
          - os: windows-latest
            name: windows
          - os: ubuntu-latest
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installers
        run: npm run make

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vellum-${{ matrix.name }}
          path: out/make/**/*

  # Publish once, after all platform builds finish. Attaching from within the
  # build matrix instead made the three jobs race each other creating the same
  # release and uploading assets concurrently, which failed intermittently
  # ("Error creating asset temp dir" / "Error saving asset").
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Publish with the gh CLI. GitHub's upload API intermittently returns
      # "HTTP 500: Error creating asset temp dir", so upload each asset on its
      # own with retries rather than in one call that a single 500 would abort.
      # mapfile -d '' (not a pipe) keeps the loop in this shell so a final
      # failure fails the step, and handles filenames with spaces.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                 --title "$GITHUB_REF_NAME" --generate-notes
          mapfile -d '' files < <(find artifacts -type f -print0)
          for f in "${files[@]}"; do
            for attempt in 1 2 3 4 5; do
              if gh release upload "$GITHUB_REF_NAME" "$f" \
                   --repo "$GITHUB_REPOSITORY" --clobber; then
                echo "uploaded $(basename "$f")"
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "::error::failed to upload $(basename "$f") after 5 attempts"
                exit 1
              fi
              echo "upload of $(basename "$f") failed (attempt $attempt); retrying in 15s"
              sleep 15
            done
          done
